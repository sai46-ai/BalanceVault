# Local development stack: PostgreSQL + BalanceVault. Postgres is not published to the host.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: balancevault
      POSTGRES_USER: balancevault
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:?Set LOCAL_PG_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancevault -d balancevault"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: balancevault
      DB_USER: balancevault
      DB_PASSWORD: ${LOCAL_PG_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    # Host 8081 -> container 8080: another local service already holds 127.0.0.1:8080 on this machine.
    ports:
      - "8081:8080"

volumes:
  pgdata:
