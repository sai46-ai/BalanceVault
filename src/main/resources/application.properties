# Loads the project-root .env as properties. Real environment variables (e.g. injected at deploy) take precedence.
# Every ${VAR} below has no default on purpose: a missing value stops startup with "Could not resolve placeholder".
spring.config.import=optional:file:.env[.properties]
spring.application.name=balancevault

server.address=0.0.0.0
server.port=${PORT}
# Trust X-Forwarded-For from the platform proxy so request.getRemoteAddr() is the client IP (used for rate limiting).
server.forward-headers-strategy=native
server.error.whitelabel.enabled=false

# Server-side sessions; the browser only holds an opaque HttpOnly cookie.
server.servlet.session.timeout=${SESSION_TTL_MINUTES}m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=BV_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE}

spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:balancevault}}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:balancevault}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=10
# Postgres may still be starting on a cold boot: keep retrying the first connection for 60 s instead of crashing.
spring.datasource.hikari.initialization-fail-timeout=60000
spring.flyway.enabled=true

# Reject request bodies carrying fields the endpoint does not declare.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=false

logging.pattern.console=%d{ISO8601} %-5level [req=%X{requestId:-}] [uid=%X{userId:-}] %logger{24} - %msg%n

bv.admin-username=${ADMIN_USERNAME}
bv.admin-password=${ADMIN_PASSWORD}
bv.invite-ttl-hours=${INVITE_TTL_HOURS}
